name: daily

on:
  schedule:
    # 毎日 00:00 JST（cron は UTC で指定する）
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "処理する記事数の上限（空欄なら全件）"
        required: false
        default: ""

# 前回の実行が長引いたときに同じ記事を二重登録しないよう、同時実行を 1 本に制限する
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Translate and register
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL_GLOSSARY_ID: ${{ secrets.DEEPL_GLOSSARY_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          LIMIT: ${{ inputs.limit }}
        run: claude-dev-watch ${LIMIT:+--limit "$LIMIT"}
